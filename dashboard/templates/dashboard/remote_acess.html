{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Remote Access - {{ device.ip_address }}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f9;

            color: #1f2937;
        }


        .header {

            height: 70px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            border-bottom: 1px solid #e5e7eb;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.05);
        }


        .title {

            font-size: 22px;

            font-weight: 700;
        }


        .device {

            font-size: 14px;

            color: #6b7280;
        }


        .back {

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 10px 16px;

            border-radius: 7px;

            font-size: 14px;
        }


        .container {

            padding: 25px;
        }


        .card {

            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }


        .viewer-header {

            padding: 18px 20px;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .viewer-title {

            font-size: 18px;

            font-weight: 700;
        }


        .connection {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;
        }


        .dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #ef4444;
        }


        .dot.connected {

            background: #22c55e;
        }


        .viewer-body {

            display: flex;

            min-height: 650px;
        }


        .agents {

            width: 240px;

            background: #f8fafc;

            border-right:
                1px solid #e5e7eb;

            padding: 15px;
        }


        .agents-title {

            font-size: 12px;

            font-weight: 700;

            color: #64748b;

            margin-bottom: 12px;
        }


        .agent {

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            padding: 12px;

            margin-bottom: 8px;

            cursor: pointer;
        }


        .agent:hover {

            border-color: #2563eb;
        }


        .agent.active {

            border-color: #2563eb;

            background: #eff6ff;
        }


        .agent-name {

            font-weight: 600;

            font-size: 14px;
        }


        .agent-ip {

            font-size: 12px;

            color: #64748b;

            margin-top: 4px;
        }


        .screen {

            flex: 1;

            background: #000;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            overflow: hidden;
        }


        #screenImage {

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;

            display: none;
        }


        #noFrame {

            color: #64748b;

            font-size: 16px;

            text-align: center;
        }


        .status-message {

            position: absolute;

            bottom: 15px;

            left: 15px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            padding: 8px 12px;

            border-radius: 6px;

            font-size: 12px;
        }


        @media (max-width: 800px) {

            .viewer-body {

                flex-direction: column;
            }

            .agents {

                width: 100%;

                border-right: none;

                border-bottom:
                    1px solid #e5e7eb;

                max-height: 200px;

                overflow-y: auto;
            }

            .screen {

                min-height: 500px;
            }
        }

    </style>

</head>


<body>


<div class="header">

    <div>

        <div class="title">
            NetShare Remote Access
        </div>

        <div class="device">
            Target:
            {{ device.ip_address }}
        </div>

    </div>


    <a
        href="{% url 'device_detail' device.ip_address %}"
        class="back"
    >
        ← Back
    </a>

</div>


<div class="container">


    <div class="card">


        <div class="viewer-header">

            <div class="viewer-title">
                Live Remote Screen
            </div>


            <div class="connection">

                <span
                    id="connectionDot"
                    class="dot"
                ></span>

                <span id="connectionText">
                    Connecting...
                </span>

            </div>

        </div>


        <div class="viewer-body">


            <div class="agents">

                <div class="agents-title">
                    CONNECTED DEVICES
                </div>

                <div id="agentList">
                    No agents connected.
                </div>

            </div>


            <div class="screen">

                <div id="noFrame">
                    Waiting for screen...
                </div>

                <img
                    id="screenImage"
                    alt="Remote Screen"
                >

                <div
                    id="statusMessage"
                    class="status-message"
                >
                    Connecting to NetShare server...
                </div>

            </div>


        </div>


    </div>


</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const TARGET_IP = "{{ device.ip_address|escapejs }}";


// Server.py WebSocket server.
//
// If Django is opened from:
// http://192.168.0.109:8000
//
// Browser connects to:
// ws://192.168.0.109:8765

const WS_URL =
    "ws://" +
    window.location.hostname +
    ":8765";


// ============================================================
// ELEMENTS
// ============================================================

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const agentList =
    document.getElementById(
        "agentList"
    );

const screenImage =
    document.getElementById(
        "screenImage"
    );

const noFrame =
    document.getElementById(
        "noFrame"
    );

const statusMessage =
    document.getElementById(
        "statusMessage"
    );


// ============================================================
// STATE
// ============================================================

let socket = null;

let selectedAgent = null;

let waitingForFrame = false;


// ============================================================
// CONNECT
// ============================================================

function connectWebSocket() {

    console.log(
        "Connecting to:",
        WS_URL
    );


    socket = new WebSocket(
        WS_URL
    );


    socket.binaryType =
        "arraybuffer";


    // --------------------------------------------------------
    // OPEN
    // --------------------------------------------------------

    socket.onopen = function() {

        console.log(
            "Connected to NetShare server."
        );


        connectionDot.classList.add(
            "connected"
        );


        connectionText.textContent =
            "Connected";


        statusMessage.textContent =
            "Connected to NetShare server.";


        socket.send(
            JSON.stringify({
                type: "viewer"
            })
        );

    };


    // --------------------------------------------------------
    // MESSAGE
    // --------------------------------------------------------

    socket.onmessage = function(event) {


        // ----------------------------------------------------
        // BINARY SCREEN FRAME
        // ----------------------------------------------------

        if (
            event.data instanceof
            ArrayBuffer
        ) {

            handleFrame(
                event.data
            );

            return;
        }


        // ----------------------------------------------------
        // TEXT MESSAGE
        // ----------------------------------------------------

        try {

            const data =
                JSON.parse(
                    event.data
                );


            // ----------------------------------------------
            // AGENT LIST
            // ----------------------------------------------

            if (
                data.type ===
                "agents"
            ) {

                updateAgents(
                    data.agents
                );

            }


            // ----------------------------------------------
            // FRAME HEADER
            // ----------------------------------------------

            else if (
                data.type ===
                "frame"
            ) {

                waitingForFrame = true;

                selectedAgent =
                    data.agent_id;

            }


        } catch (error) {

            console.error(
                "Message error:",
                error
            );

        }

    };


    // --------------------------------------------------------
    // CLOSE
    // --------------------------------------------------------

    socket.onclose = function() {

        connectionDot.classList.remove(
            "connected"
        );

        connectionText.textContent =
            "Disconnected";

        statusMessage.textContent =
            "NetShare server disconnected.";

        setTimeout(
            connectWebSocket,
            3000
        );

    };


    // --------------------------------------------------------
    // ERROR
    // --------------------------------------------------------

    socket.onerror = function(error) {

        console.error(
            "WebSocket error:",
            error
        );

        connectionText.textContent =
            "Connection error";

    };

}


// ============================================================
// AGENT LIST
// ============================================================

function updateAgents(agents) {


    if (!agents || agents.length === 0) {

        agentList.innerHTML =
            "No agents connected.";

        return;
    }


    agentList.innerHTML = "";


    agents.forEach(
        function(agent) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "agent";


            // Automatically select
            // requested device.

            if (
                agent.ip ===
                TARGET_IP
            ) {

                div.classList.add(
                    "active"
                );

                selectedAgent =
                    agent.id;

                statusMessage.textContent =
                    "Connected to " +
                    agent.ip;

            }


            div.innerHTML =

                '<div class="agent-name">' +

                escapeHtml(
                    agent.name
                ) +

                '</div>' +

                '<div class="agent-ip">' +

                escapeHtml(
                    agent.ip
                ) +

                '</div>';


            div.onclick =
                function() {

                    document
                        .querySelectorAll(
                            ".agent"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    div.classList.add(
                        "active"
                    );


                    selectedAgent =
                        agent.id;

                };


            agentList.appendChild(
                div
            );

        }
    );

}


// ============================================================
// FRAME
// ============================================================

function handleFrame(
    arrayBuffer
) {

    if (
        !waitingForFrame
    ) {

        return;

    }


    if (
        selectedAgent === null
    ) {

        return;

    }


    const blob =
        new Blob(
            [arrayBuffer],
            {
                type: "image/jpeg"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    screenImage.onload =
        function() {

            URL.revokeObjectURL(
                url
            );

        };


    screenImage.src =
        url;


    screenImage.style.display =
        "block";


    noFrame.style.display =
        "none";


    statusMessage.textContent =
        "Live screen";


    waitingForFrame =
        false;

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


// ============================================================
// START
// ============================================================

connectWebSocket();


</script>


</body>

</html>
